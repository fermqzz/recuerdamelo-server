<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recuérdamelo">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Recuérdamelo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f5f7;--white:#ffffff;--surface2:#f0f0f5;--border:#e5e5ea;--border2:#d1d1d6;
  --text:#0a0a0a;--text2:#6e6e73;--text3:#aeaeb2;
  --accent:#0055ff;--accent-light:#e8eeff;
  --danger:#ff3b30;--danger-light:#fff0ef;
  --radius:18px;--radius-sm:12px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.header{padding:56px 22px 0;background:var(--bg);flex-shrink:0}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.app-title{font-size:32px;font-weight:700;color:var(--text);letter-spacing:-1px;line-height:1}
.app-date{font-size:13px;color:var(--text2);margin-top:2px}
.header-btn{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tabs-wrap{padding:16px 22px 14px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:8px;width:max-content}
.tab{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all .18s;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:4px 22px 110px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.section-label{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--text3);text-transform:uppercase;margin:22px 0 10px}
.card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:15px 16px;margin-bottom:10px;display:flex;gap:13px;align-items:flex-start;cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card:active{transform:scale(.98);box-shadow:none}
.card.done{opacity:.45}
.card.urgent{border-color:var(--accent);background:var(--accent-light)}
.card.urgent .card-title{color:var(--accent)}
.card-stripe{width:4px;border-radius:3px;flex-shrink:0;align-self:stretch;min-height:34px}
.card-body{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px;line-height:1.3}
.card.done .card-title{text-decoration:line-through;color:var(--text3)}
.card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.card-info{font-size:12px;color:var(--text2)}
.card-chevron{color:var(--text3);font-size:20px;align-self:center;flex-shrink:0}
.card-rec{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--accent);font-weight:600}
.card-rec svg{width:12px;height:12px;stroke:var(--accent)}
.calendar-wrap{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.cal-month{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.cal-nav{display:flex;gap:8px}
.cal-nav-btn{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;font-weight:600}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal-day-name{text-align:center;font-size:10px;color:var(--text3);font-weight:600;padding:3px 0;text-transform:uppercase;letter-spacing:.4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{min-height:48px;border-radius:10px;padding:4px 3px;transition:background .12s}
.cal-cell.today{background:var(--accent-light)}
.cal-cell.today .cal-day-num{color:var(--accent);font-weight:700}
.cal-cell.other-month .cal-day-num{color:var(--text3)}
.cal-day-num{font-size:12px;font-weight:500;text-align:center;margin-bottom:3px;color:var(--text)}
.cal-event-labels{display:flex;flex-direction:column;gap:1px}
.cal-event-label{font-size:7.5px;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;font-weight:700}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;padding:10px 0 30px;max-width:430px;margin:0 auto}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--text3);font-size:9px;font-weight:600;letter-spacing:.3px;transition:color .15s;border:none;background:transparent;font-family:'Inter',sans-serif}
.nav-item.active{color:var(--accent)}
.nav-item svg{width:22px;height:22px;stroke-width:1.8}
.fab{position:absolute;bottom:92px;right:22px;width:54px;height:54px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;box-shadow:0 6px 20px rgba(0,85,255,.4);z-index:10}
.fab:active{transform:scale(.93)}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--white);border-radius:26px 26px 0 0;padding:20px 22px 50px;width:100%;transform:translateY(24px);transition:transform .25s;max-height:92vh;overflow-y:auto}
.modal::-webkit-scrollbar{display:none}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-handle{width:38px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:18px;letter-spacing:-.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.6px}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;font-family:'Inter',sans-serif;font-weight:500;outline:none;transition:border-color .15s;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--white)}
.field select option{background:var(--white)}
.field textarea{resize:none;height:72px}
.color-row{display:flex;gap:9px;flex-wrap:wrap}
.color-opt{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s;outline:2.5px solid transparent;outline-offset:2px}
.color-opt.selected{outline-color:var(--accent);transform:scale(1.15)}
.recurrence-row{display:flex;gap:8px;flex-wrap:wrap}
.rec-opt{padding:8px 15px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif}
.rec-opt.selected{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.btn-primary{flex:1;padding:14px;border-radius:var(--radius-sm);background:var(--accent);border:none;color:#fff;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer}
.btn-primary:active{opacity:.85}
.btn-secondary{padding:14px 18px;border-radius:var(--radius-sm);background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);font-size:15px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer}
.type-row{display:flex;gap:8px;margin-bottom:16px}
.type-opt{flex:1;padding:11px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:all .18s;font-family:'Inter',sans-serif}
.type-opt.selected{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn-delete{width:100%;margin-top:10px;padding:14px;border-radius:var(--radius-sm);background:var(--danger-light);border:1.5px solid #ffcfcc;color:var(--danger);font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.cat-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.cat-color-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.cat-name{flex:1;font-size:14px;font-weight:500}
.cat-delete{background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px}
.section-divider{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.section-divider-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.empty{text-align:center;padding:50px 20px}
.empty-icon{font-size:42px;margin-bottom:12px}
.empty p{font-size:13px;line-height:1.7;color:var(--text2)}
.toast{position:absolute;top:64px;left:22px;right:22px;background:var(--text);border-radius:var(--radius-sm);padding:12px 18px;font-size:13px;font-weight:600;color:#fff;z-index:300;opacity:0;transform:translateY(-6px);transition:all .22s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}
.push-banner{background:var(--accent-light);border:1.5px solid var(--accent);border-radius:var(--radius-sm);padding:12px 16px;margin:12px 0;display:flex;align-items:center;gap:10px;cursor:pointer}
.push-banner p{font-size:13px;font-weight:500;color:var(--accent);flex:1;line-height:1.4}
.push-banner span{font-size:20px}
</style>
</head>
<body>
<div id="app">
  <div class="toast" id="toast"></div>

  <div id="view-home" class="view" style="display:flex;flex-direction:column;height:100%">
    <div class="header">
      <div class="header-top">
        <div><div class="app-title">Recuérdamelo</div><div class="app-date" id="header-date"></div></div>
        <button class="header-btn" onclick="openCatManager()">⚙</button>
      </div>
    </div>
    <div class="tabs-wrap"><div class="tabs" id="tabs-container"></div></div>
    <div class="content" id="home-content"></div>
  </div>

  <div id="view-calendar" class="view" style="display:none;flex-direction:column;height:100%">
    <div class="header"><div class="header-top"><div class="app-title">Calendario</div></div></div>
    <div class="content" style="padding-top:16px" id="calendar-content"></div>
  </div>

  <div id="view-lists" class="view" style="display:none;flex-direction:column;height:100%">
    <div class="header">
      <div class="header-top">
        <div class="app-title">Tareas</div>
        <div style="font-size:13px;font-weight:500;color:var(--text2);align-self:flex-end;padding-bottom:4px" id="tasks-count"></div>
      </div>
    </div>
    <div class="tabs-wrap"><div class="tabs" id="tasks-tabs"></div></div>
    <div class="content" id="lists-content"></div>
  </div>

  <button class="fab" id="fab" onclick="openAddModal()">+</button>

  <div class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="switchView('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      INICIO
    </button>
    <button class="nav-item" id="nav-calendar" onclick="switchView('calendar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      CALENDARIO
    </button>
    <button class="nav-item" id="nav-lists" onclick="switchView('lists')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      TAREAS
    </button>
  </div>

  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modal-title-text">Nuevo recordatorio</div>
      <div class="type-row" id="type-row">
        <button class="type-opt selected" id="type-evento" onclick="selectType('evento')">📅 Evento</button>
        <button class="type-opt" id="type-tarea" onclick="selectType('tarea')">🔁 Tarea recurrente</button>
      </div>
      <div class="field"><label>Título</label><input type="text" id="input-title" placeholder="¿Qué tienes que hacer?"></div>
      <div class="field"><label>Categoría</label><select id="input-cat"></select></div>
      <div id="evento-fields">
        <div class="field"><label>Fecha</label><input type="date" id="input-date"></div>
        <div class="field"><label>Hora (opcional)</label><input type="time" id="input-time"></div>
        <div class="field"><label>Notas</label><textarea id="input-notes" placeholder="Detalles adicionales..."></textarea></div>
      </div>
      <div id="tarea-fields" style="display:none">
        <div class="field">
          <label>Recordármelo</label>
          <div class="recurrence-row">
            <button class="rec-opt selected" data-val="1" onclick="selectRec(this)">1× al día</button>
            <button class="rec-opt" data-val="2" onclick="selectRec(this)">2× al día</button>
            <button class="rec-opt" data-val="3" onclick="selectRec(this)">3× al día</button>
            <button class="rec-opt" data-val="5" onclick="selectRec(this)">5× al día</button>
          </div>
        </div>
        <div class="field"><label>Notas</label><textarea id="input-notes-t" placeholder="Detalles..."></textarea></div>
      </div>
      <div class="modal-btns">
        <button class="btn-secondary" onclick="closeModal('add-modal')">Cancelar</button>
        <button class="btn-primary" onclick="saveItem()">Guardar</button>
      </div>
      <button id="btn-delete-item" class="btn-delete" style="display:none" onclick="confirmDeleteItem()">Eliminar</button>
    </div>
  </div>

  <div class="modal-overlay" id="cat-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Categorías</div>
      <div id="cat-list"></div>
      <div class="section-divider">
        <div class="section-divider-label">Nueva categoría</div>
        <div class="field"><input type="text" id="new-cat-name" placeholder="Nombre"></div>
        <div class="field"><label>Color</label><div class="color-row" id="color-picker"></div></div>
        <div class="modal-btns">
          <button class="btn-secondary" onclick="closeModal('cat-modal')">Cerrar</button>
          <button class="btn-primary" onclick="addCategory()">Añadir</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONFIGURACIÓN — pon aquí la URL de tu servidor Railway ──
const SERVER_URL = 'https://recuerdamelo-server-production.up.railway.app'; // ej: https://recuerdame-server.up.railway.app

const COLORS=['#0055ff','#ff3b30','#ff9500','#34c759','#af52de','#ff2d55','#5ac8fa','#ffcc00','#00c7be','#ff6b35'];
const DAYS=['L','M','X','J','V','S','D'];
let state=load(),currentView='home',activeTab='all',activeTaskTab='all',currentType='evento',selectedRec=1,calDate=new Date(),editingId=null;
let deviceId=localStorage.getItem('recuerdamelo_device_id');
if(!deviceId){deviceId=Math.random().toString(36).slice(2,12);localStorage.setItem('recuerdamelo_device_id',deviceId);}

function load(){
  const d=localStorage.getItem('recuerdamelo_v1');
  if(d)return JSON.parse(d);
  return{categories:[{id:'c1',name:'Médico',color:'#af52de'},{id:'c2',name:'Novia',color:'#ff2d55'},{id:'c3',name:'Compra',color:'#34c759'},{id:'c4',name:'Personal',color:'#0055ff'}],items:[]};
}
function save(){localStorage.setItem('recuerdamelo_v1',JSON.stringify(state));syncNotifications();}
function uid(){return Math.random().toString(36).slice(2,9);}
function fmtDate(d){const dy=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],mo=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return`${dy[d.getDay()]}, ${d.getDate()} de ${mo[d.getMonth()]}`;}
function fmtShort(s){const d=new Date(s+'T12:00:00'),mo=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${d.getDate()} ${mo[d.getMonth()]}`;}
function getCat(id){return state.categories.find(c=>c.id===id)||{name:'Sin categoría',color:'#aeaeb2'};}
function hexAlpha(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

// ── Push notifications ──
async function initPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.register('./recuerdamelo-sw.js');
    await navigator.serviceWorker.ready;

    const res = await fetch(`${SERVER_URL}/vapid-public`);
    const {key} = await res.json();

    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(key)
      });
    }

    await fetch(`${SERVER_URL}/subscribe`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: deviceId, subscription: sub})
    });

    syncNotifications();
  } catch(e){
    console.warn('Push init error:', e);
  }
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function syncNotifications(){
  if(!('serviceWorker' in navigator)) return;
  const notifications=[];
  const now=new Date();

  // Convierte hora local HH:MM a UTC HH:MM
  function localToUtc(h,m){
    const d=new Date();d.setHours(h,m,0,0);
    return`${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
  }

  // Tareas recurrentes — generar horas de notificación
  const SLOT_HOURS=[8,12,16,19,21];
  state.items.filter(i=>i.type==='tarea'&&!i.done&&i.recurrence).forEach(item=>{
    SLOT_HOURS.slice(0,item.recurrence).forEach(h=>{
      notifications.push({
        time:localToUtc(h,0),
        title:'Recuérdamelo 🔔',
        body:item.title,
        tag:`tarea-${item.id}-${h}`
      });
    });
  });

  // Eventos con hora — notificación 30 min antes
  const todayStr=now.toISOString().slice(0,10);
  state.items.filter(i=>i.type==='evento'&&!i.done&&i.date&&i.time).forEach(item=>{
    if(item.date<todayStr) return;
    const [hh,mm]=item.time.split(':').map(Number);
    let notifMin=mm-30, notifH=hh;
    if(notifMin<0){notifMin+=60;notifH--;}
    if(notifH<0) return;
    notifications.push({
      time:localToUtc(notifH,notifMin),
      title:`📅 En 30 min: ${item.title}`,
      body:item.date===todayStr?item.time:(item.date+' '+item.time),
      tag:`evento-${item.id}`
    });
  });

  try{
    await fetch(`${SERVER_URL}/notifications`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id:deviceId, notifications})
    });
  } catch(e){
    console.warn('Sync error:', e);
  }
}

async function requestPushPermission(){
  if(Notification.permission==='denied'){showToast('Activa notificaciones en Ajustes');return;}
  const perm=await Notification.requestPermission();
  if(perm==='granted') initPush();
}

function pushBanner(){
  if(!('PushManager' in window)||Notification.permission==='granted') return '';
  return`<div class="push-banner" onclick="requestPushPermission()">
    <span>🔔</span>
    <p>Activa las notificaciones para recordatorios automáticos</p>
    <span>›</span>
  </div>`;
}

// ── Views ──
function switchView(v){
  currentView=v;
  document.querySelectorAll('.view').forEach(el=>el.style.display='none');
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('view-'+v);el.style.display='flex';el.style.flexDirection='column';
  document.getElementById('nav-'+v).classList.add('active');
  document.getElementById('fab').style.display=v==='calendar'?'none':'flex';
  if(v==='home')renderHome();if(v==='calendar')renderCalendar();if(v==='lists')renderLists();
}

function renderHome(){
  document.getElementById('header-date').textContent=fmtDate(new Date());
  renderTabs();renderHomeContent();
}
function renderTabs(){
  document.getElementById('tabs-container').innerHTML=[{id:'all',name:'Todo',color:'#0055ff'},...state.categories].map(c=>`<button class="tab ${activeTab===c.id?'active':''}" onclick="setTab('${c.id}')">${activeTab!==c.id?`<span class="tab-dot" style="background:${c.color}"></span>`:''} ${c.name}</button>`).join('');
}
function setTab(id){activeTab=id;renderTabs();renderHomeContent();}
function renderHomeContent(){
  const today=new Date().toISOString().slice(0,10);
  let evs=state.items.filter(i=>i.type==='evento');
  let f=activeTab==='all'?evs:evs.filter(i=>i.catId===activeTab);
  f.sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);
  const tod=f.filter(i=>!i.done&&i.date===today),up=f.filter(i=>!i.done&&i.date&&i.date>today),nd=f.filter(i=>!i.done&&!i.date),dn=f.filter(i=>i.done&&i.doneDate===today);
  let h=pushBanner();
  if(tod.length)h+='<div class="section-label">Hoy</div>'+tod.map(i=>eCard(i,true)).join('');
  if(up.length)h+='<div class="section-label">Próximamente</div>'+up.map(i=>eCard(i,false)).join('');
  if(nd.length)h+='<div class="section-label">Sin fecha</div>'+nd.map(i=>eCard(i,false)).join('');
  if(dn.length)h+='<div class="section-label">Completado hoy</div>'+dn.map(i=>eCard(i,false)).join('');
  if(!f.length&&!dn.length)h+=`<div class="empty"><div class="empty-icon">📋</div><p>Sin eventos pendientes.<br>Pulsa <strong>+</strong> para añadir uno.</p></div>`;
  document.getElementById('home-content').innerHTML=h;
}
function eCard(item,urgent){
  const cat=getCat(item.catId);let info='';
  if(item.date){info=fmtShort(item.date);if(item.time)info+=' · '+item.time;}
  if(item.notes&&!info)info=item.notes.slice(0,45)+(item.notes.length>45?'…':'');
  return`<div class="card${urgent&&!item.done?' urgent':''} ${item.done?'done':''}" onclick="openEditModal('${item.id}')">
    <div class="card-stripe" style="background:${cat.color}"></div>
    <div class="card-body"><div class="card-title">${item.title}</div>
    <div class="card-meta"><span class="card-badge" style="background:${hexAlpha(cat.color,.13)};color:${cat.color}">${cat.name}</span>${info?`<span class="card-info">${info}</span>`:''}</div></div>
    <div class="card-chevron">›</div></div>`;
}

function renderLists(){
  document.getElementById('tasks-tabs').innerHTML=[{id:'all',name:'Todas',color:'#0055ff'},...state.categories].map(c=>`<button class="tab ${activeTaskTab===c.id?'active':''}" onclick="setTaskTab('${c.id}')">${activeTaskTab!==c.id?`<span class="tab-dot" style="background:${c.color}"></span>`:''} ${c.name}</button>`).join('');
  const tasks=state.items.filter(i=>i.type==='tarea');
  const f=activeTaskTab==='all'?tasks:tasks.filter(i=>i.catId===activeTaskTab);
  const pend=f.filter(i=>!i.done),done=f.filter(i=>i.done);
  document.getElementById('tasks-count').textContent=`${pend.length} pendiente${pend.length!==1?'s':''}`;
  let h='';
  if(pend.length)h+=pend.map(tCard).join('');
  if(done.length)h+='<div class="section-label" style="margin-top:20px">Completadas</div>'+done.map(tCard).join('');
  if(!f.length)h=`<div class="empty"><div class="empty-icon">✅</div><p>Sin tareas recurrentes.<br>Pulsa <strong>+</strong> para añadir una.</p></div>`;
  document.getElementById('lists-content').innerHTML=h;
}
function setTaskTab(id){activeTaskTab=id;renderLists();}
function tCard(item){
  const cat=getCat(item.catId),rt=item.recurrence?`${item.recurrence}× al día`:'';
  return`<div class="card ${item.done?'done':''}" onclick="openEditModal('${item.id}')">
    <div class="card-stripe" style="background:${cat.color}"></div>
    <div class="card-body"><div class="card-title">${item.title}</div>
    <div class="card-meta"><span class="card-badge" style="background:${hexAlpha(cat.color,.13)};color:${cat.color}">${cat.name}</span>
    ${rt?`<span class="card-rec"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>${rt}</span>`:''}
    ${item.notes?`<span class="card-info">${item.notes.slice(0,45)}</span>`:''}</div></div>
    <div class="card-chevron">›</div></div>`;
}

function renderCalendar(){
  const yr=calDate.getFullYear(),mo=calDate.getMonth();
  const mos=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const tod=new Date();
  let sdow=new Date(yr,mo,1).getDay();sdow=sdow===0?6:sdow-1;
  const dim=new Date(yr,mo+1,0).getDate(),dip=new Date(yr,mo,0).getDate();
  const evBD={};
  state.items.filter(i=>i.type==='evento'&&i.date).forEach(i=>{if(!evBD[i.date])evBD[i.date]=[];evBD[i.date].push(i);});
  let cells='';
  for(let i=sdow-1;i>=0;i--)cells+=`<div class="cal-cell other-month"><div class="cal-day-num">${dip-i}</div></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isT=tod.getFullYear()===yr&&tod.getMonth()===mo&&tod.getDate()===d;
    const evs=evBD[ds]||[];
    const lbs=evs.slice(0,2).map(e=>{const cat=getCat(e.catId);return`<div class="cal-event-label" style="background:${hexAlpha(cat.color,.15)};color:${cat.color}">${e.title}</div>`;}).join('');
    cells+=`<div class="cal-cell${isT?' today':''}"><div class="cal-day-num">${d}</div><div class="cal-event-labels">${lbs}</div></div>`;
  }
  const rem=(sdow+dim)%7;for(let d=1;d<=(rem?7-rem:0);d++)cells+=`<div class="cal-cell other-month"><div class="cal-day-num">${d}</div></div>`;
  const mStr=`${yr}-${String(mo+1).padStart(2,'0')}`;
  const mEvs=state.items.filter(i=>i.type==='evento'&&i.date&&i.date.startsWith(mStr)).sort((a,b)=>a.date<b.date?-1:1);
  const todStr=new Date().toISOString().slice(0,10);
  const evList=mEvs.length?'<div class="section-label" style="margin-top:20px">Este mes</div>'+mEvs.map(i=>eCard(i,i.date===todStr&&!i.done)).join(''):'';
  document.getElementById('calendar-content').innerHTML=`<div class="calendar-wrap">
    <div class="cal-header"><div class="cal-month">${mos[mo]} ${yr}</div>
    <div class="cal-nav"><button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button><button class="cal-nav-btn" onclick="changeMonth(1)">›</button></div></div>
    <div class="cal-days-header">${DAYS.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div></div>${evList}`;
}
function changeMonth(d){calDate.setMonth(calDate.getMonth()+d);renderCalendar();}

function openAddModal(){
  editingId=null;
  document.getElementById('input-title').value='';
  document.getElementById('input-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('input-time').value='';document.getElementById('input-notes').value='';document.getElementById('input-notes-t').value='';
  document.getElementById('modal-title-text').textContent='Nuevo recordatorio';
  document.getElementById('type-row').style.display='flex';
  document.getElementById('btn-delete-item').style.display='none';
  populateCatSelect();selectType('evento');selectedRec=1;
  document.querySelectorAll('.rec-opt').forEach(b=>b.classList.toggle('selected',b.dataset.val==='1'));
  document.getElementById('add-modal').classList.add('open');
}
function openEditModal(id){
  const item=state.items.find(i=>i.id===id);if(!item)return;
  editingId=id;populateCatSelect();
  document.getElementById('input-title').value=item.title;
  document.getElementById('input-cat').value=item.catId;
  document.getElementById('modal-title-text').textContent='Editar';
  document.getElementById('type-row').style.display='flex';
  document.getElementById('btn-delete-item').style.display='block';
  selectType(item.type);
  if(item.type==='evento'){document.getElementById('input-date').value=item.date||'';document.getElementById('input-time').value=item.time||'';document.getElementById('input-notes').value=item.notes||'';}
  else{selectedRec=item.recurrence||1;document.querySelectorAll('.rec-opt').forEach(b=>b.classList.toggle('selected',parseInt(b.dataset.val)===selectedRec));document.getElementById('input-notes-t').value=item.notes||'';}
  document.getElementById('add-modal').classList.add('open');
}
function populateCatSelect(){document.getElementById('input-cat').innerHTML=state.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function selectType(t){
  currentType=t;
  document.getElementById('type-evento').classList.toggle('selected',t==='evento');
  document.getElementById('type-tarea').classList.toggle('selected',t==='tarea');
  document.getElementById('evento-fields').style.display=t==='evento'?'block':'none';
  document.getElementById('tarea-fields').style.display=t==='tarea'?'block':'none';
}
function selectRec(btn){selectedRec=parseInt(btn.dataset.val);document.querySelectorAll('.rec-opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');}

function saveItem(){
  const title=document.getElementById('input-title').value.trim();if(!title){showToast('Escribe un título');return;}
  const catId=document.getElementById('input-cat').value;
  if(editingId){
    const idx=state.items.findIndex(i=>i.id===editingId);
    if(idx>=0)state.items[idx]={...state.items[idx],title,catId,type:currentType,
      ...(currentType==='evento'?{date:document.getElementById('input-date').value||null,time:document.getElementById('input-time').value||null,notes:document.getElementById('input-notes').value,recurrence:null}
      :{recurrence:selectedRec,notes:document.getElementById('input-notes-t').value,date:null,time:null})};
  } else {
    const item={id:uid(),type:currentType,title,catId,done:false,createdAt:new Date().toISOString()};
    if(currentType==='evento'){item.date=document.getElementById('input-date').value||null;item.time=document.getElementById('input-time').value||null;item.notes=document.getElementById('input-notes').value;}
    else{item.recurrence=selectedRec;item.notes=document.getElementById('input-notes-t').value;}
    state.items.push(item);
  }
  save();closeModal('add-modal');showToast('✓ Guardado');refresh();
}
function confirmDeleteItem(){
  if(!editingId)return;const id=editingId;closeModal('add-modal');
  state.items=state.items.filter(i=>i.id!==id);save();showToast('Eliminado');refresh();editingId=null;
}
function refresh(){if(currentView==='home')renderHome();if(currentView==='lists')renderLists();if(currentView==='calendar')renderCalendar();}

function openCatManager(){renderCatList();renderColorPicker();document.getElementById('cat-modal').classList.add('open');}
function renderCatList(){document.getElementById('cat-list').innerHTML=state.categories.map(c=>`<div class="cat-item"><div class="cat-color-dot" style="background:${c.color}"></div><div class="cat-name">${c.name}</div><button class="cat-delete" onclick="deleteCat('${c.id}')">✕</button></div>`).join('');}
let selectedColor=COLORS[0];
function renderColorPicker(){document.getElementById('color-picker').innerHTML=COLORS.map(c=>`<div class="color-opt ${c===selectedColor?'selected':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('');}
function pickColor(c){selectedColor=c;renderColorPicker();}
function addCategory(){
  const name=document.getElementById('new-cat-name').value.trim();if(!name){showToast('Escribe un nombre');return;}
  state.categories.push({id:uid(),name,color:selectedColor});save();
  document.getElementById('new-cat-name').value='';renderCatList();showToast('Categoría añadida');
  if(currentView==='home')renderHome();if(currentView==='lists')renderLists();
}
function deleteCat(id){
  if(state.items.some(i=>i.catId===id)){showToast('Reasigna los elementos primero');return;}
  state.categories=state.categories.filter(c=>c.id!==id);save();renderCatList();
  if(currentView==='home')renderHome();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

renderHome();
document.querySelectorAll('.modal-overlay').forEach(el=>{el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');});});

// Init push si ya tiene permiso
if(Notification.permission==='granted') initPush();
</script>
